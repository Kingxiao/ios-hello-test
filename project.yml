name: HelloApp
options:
  bundleIdPrefix: com.kingxiao
  deploymentTarget:
    iOS: "17.0"
packages:
  CounterKit:
    path: Packages/CounterKit
targets:
  HelloApp:
    type: application
    platform: iOS
    scheme:
      testTargets: [HelloAppUITests]
    sources: [App]
    dependencies:
      - package: CounterKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingxiao.helloapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hello
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  HelloAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HelloApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kingxiao.helloapp.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HelloApp
