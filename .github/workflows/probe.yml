name: Probe runners
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: |
          echo "== Xcodes"; ls -d /Applications/Xcode*.app
          echo "== default"; xcodebuild -version
          echo "== runtimes"; xcrun simctl list runtimes
          echo "== device types (iPhone/iPad)"; xcrun simctl list devicetypes | grep -E "iPhone|iPad"
          echo "== downloadable"; xcodebuild -showComponent iOS 2>&1 | head -20 || true
