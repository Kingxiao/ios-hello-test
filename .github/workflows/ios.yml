name: iOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # 打 v* 标签或手动触发才跑 macOS（私有库按 10 倍计费）
  # push 到 master 只跑 Linux 上的逻辑测试

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-tests:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path Packages/CounterKit

  ios-build:
    name: iOS build + UI tests (macOS)
    needs: logic-tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: UI tests on simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project HelloApp.xcodeproj -scheme HelloApp \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee build-test.log | grep -E "Test Case|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-test.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p out/raw out/screenshots
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path out/raw
          python3 - <<'PY'
          import json, shutil
          for test in json.load(open("out/raw/manifest.json")):
              for a in test["attachments"]:
                  name = a["suggestedHumanReadableName"].split("_")[0] + ".png"
                  shutil.copy(f"out/raw/{a['exportedFileName']}", f"out/screenshots/{name}")
                  print(name)
          PY

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HelloApp.xcodeproj -scheme HelloApp \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tee build-device.log | tail -5

      - name: Package unsigned app
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Debug-iphoneos/HelloApp.app out/Payload/
          (cd out && zip -qr HelloApp-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HelloApp-${{ github.sha }}
          path: |
            out/*.ipa
            out/screenshots/
            build-*.log
          retention-days: 7
